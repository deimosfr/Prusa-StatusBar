name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RTK_DISABLE: "1"

jobs:
  lint-test:
    name: Lint and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Xcode version
        id: xcode-pin
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode-pin.outputs.version }}

      - name: Install Homebrew tooling
        run: |
          brew update
          brew install just xcodegen swiftlint swiftformat

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('project.yml', 'PrusaStatusBar/**/*.swift', 'PrusaStatusBarTests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Cache go2rtc helper
        uses: actions/cache@v4
        with:
          path: PrusaStatusBar/Resources/go2rtc
          key: go2rtc-${{ hashFiles('scripts/fetch-go2rtc.sh') }}

      - name: Generate Xcode project
        run: just gen

      - name: Lint and format check
        run: just check

      - name: Run tests
        run: just test
