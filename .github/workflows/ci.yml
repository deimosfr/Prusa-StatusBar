name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  RTK_DISABLE: "1"

jobs:
  lint-test:
    name: Lint and test
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify project.yml MARKETING_VERSION matches committed pbxproj
        run: ./scripts/check-version-sync.sh

      - name: Read pinned Xcode version
        id: xcode-pin
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode-pin.outputs.version }}

      - name: Install Homebrew tooling
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew update
          brew install just xcodegen swiftlint swiftformat

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('project.yml', 'PrusaStatusBar/**/*.swift', 'PrusaStatusBarTests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Cache VLCKit framework
        uses: actions/cache@v5
        with:
          path: Vendor/VLCKit.xcframework
          key: vlckit-${{ hashFiles('scripts/fetch-vlckit.sh') }}

      - name: Generate Xcode project
        run: just gen

      - name: Lint and format check
        run: just check

      - name: Run tests
        run: just test

  build-dmg:
    name: Build ad-hoc DMG (${{ matrix.arch }})
    needs: lint-test
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read pinned Xcode version
        id: xcode-pin
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode-pin.outputs.version }}

      - name: Install Homebrew tooling
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew update
          brew install just xcodegen create-dmg

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('project.yml', 'PrusaStatusBar/**/*.swift', 'PrusaStatusBarTests/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Cache VLCKit framework
        uses: actions/cache@v5
        with:
          path: Vendor/VLCKit.xcframework
          key: vlckit-${{ hashFiles('scripts/fetch-vlckit.sh') }}

      - name: Resolve metadata
        id: meta
        run: |
          set -euo pipefail
          PR_NUM=${{ github.event.pull_request.number }}
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          VERSION=$(grep -E '^[[:space:]]*MARKETING_VERSION:' project.yml | head -n1 | sed -E 's/.*MARKETING_VERSION:[[:space:]]*"([^"]+)".*/\1/')
          DMG_NAME="PrusaStatusBar-${VERSION}-pr${PR_NUM}-${SHORT_SHA}-${{ matrix.arch }}.dmg"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dmg_name=${DMG_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: just gen

      - name: Build Release .app (${{ matrix.arch }})
        run: |
          set -euo pipefail
          xcodebuild \
            -project PrusaStatusBar.xcodeproj \
            -scheme PrusaStatusBar \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${VERSION}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            clean build
          lipo -info "build/Build/Products/Release/PrusaStatusBar.app/Contents/MacOS/PrusaStatusBar"

      - name: Package DMG (ad-hoc signed)
        run: |
          set -euo pipefail
          ./scripts/make-dmg.sh \
            "build/Build/Products/Release/PrusaStatusBar.app" \
            "${DMG_NAME}"

      - name: Compute sha256
        run: |
          SHA256=$(shasum -a 256 "${DMG_NAME}" | cut -d ' ' -f1)
          echo "${SHA256}" > "${DMG_NAME}.sha256"
          echo "sha256(${DMG_NAME})=${SHA256}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.pull_request.number }}-dmg-${{ matrix.arch }}
          path: |
            ${{ env.DMG_NAME }}
            ${{ env.DMG_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish-beta:
    name: Publish beta DMGs
    needs: build-dmg
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      dmg_arm64: ${{ steps.meta.outputs.dmg_arm64 }}
      dmg_x86_64: ${{ steps.meta.outputs.dmg_x86_64 }}
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v6

      - name: Download DMG artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pr-${{ github.event.pull_request.number }}-dmg-*
          path: dist
          merge-multiple: true

      - name: Resolve release metadata
        id: meta
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ARM64_DMG=$(find dist -maxdepth 1 -name '*-arm64.dmg' -print -quit)
          X86_64_DMG=$(find dist -maxdepth 1 -name '*-x86_64.dmg' -print -quit)
          test -n "$ARM64_DMG"
          test -n "$X86_64_DMG"
          echo "tag=beta-pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "dmg_arm64=$(basename "$ARM64_DMG")" >> "$GITHUB_OUTPUT"
          echo "dmg_x86_64=$(basename "$X86_64_DMG")" >> "$GITHUB_OUTPUT"

      - name: Move beta tag to this build
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git tag --force "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

      - name: Remove previous beta assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null |
            while IFS= read -r asset; do
              gh release delete-asset "$TAG" "$asset" --yes
            done || true

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Beta build for PR #${{ github.event.pull_request.number }}"
          prerelease: true
          files: |
            dist/${{ steps.meta.outputs.dmg_arm64 }}
            dist/${{ steps.meta.outputs.dmg_arm64 }}.sha256
            dist/${{ steps.meta.outputs.dmg_x86_64 }}
            dist/${{ steps.meta.outputs.dmg_x86_64 }}.sha256

  comment-pr:
    name: Comment on PR with beta download links
    needs: publish-beta
    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post beta build comment
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            const tag = '${{ needs.publish-beta.outputs.tag }}';
            const releaseUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}`;
            const marker = '<!-- beta-build-comment -->';
            const body = [
              marker,
              '## Beta build ready',
              '',
              `Ad-hoc signed DMGs for commit \`${sha}\`:`,
              '',
              '| Download | Architecture |',
              '|---|---|',
              `| [Download DMG](${releaseUrl}/${{ needs.publish-beta.outputs.dmg_arm64 }}) | Apple Silicon (M1/M2/M3/M4) |`,
              `| [Download DMG](${releaseUrl}/${{ needs.publish-beta.outputs.dmg_x86_64 }}) | Intel |`,
              '',
              '**Gatekeeper bypass required** (ad-hoc signed, not notarized):',
              '```bash',
              'xattr -dr com.apple.quarantine /Applications/PrusaStatusBar.app',
              '```',
              'Or: right-click the app > Open > Open (two-step, first time only).',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(comment =>
              /<!-- beta-build-comment(?::[^>]*)? -->/.test(comment.body)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  cleanup-beta:
    name: Remove beta release
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete beta release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: beta-pr-${{ github.event.pull_request.number }}
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            while IFS= read -r tag; do
              case "$tag" in
                "$TAG_PREFIX"|"$TAG_PREFIX"-*) gh release delete "$tag" --yes --cleanup-tag ;;
              esac
            done || true
