name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RTK_DISABLE: "1"

jobs:
  build-dmg:
    name: Build DMG (${{ matrix.arch }})
    runs-on: macos-26
    environment: main
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify tag matches project.yml MARKETING_VERSION
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(grep -E '^[[:space:]]*MARKETING_VERSION:' project.yml | head -n1 | sed -E 's/.*MARKETING_VERSION:[[:space:]]*"([^"]+)".*/\1/')
          if [[ -z "$PROJECT_VERSION" ]]; then
            echo "Failed to parse MARKETING_VERSION from project.yml" >&2
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Version mismatch: tag '${GITHUB_REF_NAME}' implies '${TAG_VERSION}' but project.yml MARKETING_VERSION is '${PROJECT_VERSION}'." >&2
            echo "Fix: bump MARKETING_VERSION in project.yml to '${TAG_VERSION}', commit, retag, push." >&2
            exit 1
          fi
          echo "Version OK: ${TAG_VERSION}"

      - name: Verify committed pbxproj is in sync with project.yml
        run: ./scripts/check-version-sync.sh

      - name: Read pinned Xcode version
        id: xcode-pin
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode-pin.outputs.version }}

      - name: Install Homebrew tooling
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew update
          brew install just xcodegen swiftlint swiftformat create-dmg

      - name: Resolve version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="PrusaStatusBar-${VERSION}-${{ matrix.arch }}.dmg"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dmg_name=${DMG_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: just gen

      - name: Import Developer ID signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          # Strip whitespace/newlines (gh secret values can carry them) before decoding.
          printf '%s' "$MACOS_CERT_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$CERT_PATH"
          if [[ ! -s "$CERT_PATH" ]]; then
            echo "Decoded cert is empty; check MACOS_CERT_P12_BASE64 secret." >&2
            exit 1
          fi
          file "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Import .p12 (cert + private key). Omit `-t` so security infers from -f pkcs12.
          # `-T` grants codesign/security access without an interactive prompt.
          security import "$CERT_PATH" \
            -P "$MACOS_CERT_PASSWORD" \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Prepend our keychain so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '" ')
          rm -f "$CERT_PATH"
          # Sanity check: identity is visible.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Decode notary API key
        env:
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$MACOS_NOTARY_KEY_P8_BASE64" | base64 --decode > "$AUTH_KEY_PATH"
          chmod 600 "$AUTH_KEY_PATH"
          echo "AUTH_KEY_PATH=$AUTH_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build Release .app (${{ matrix.arch }})
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project PrusaStatusBar.xcodeproj \
            -scheme PrusaStatusBar \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${VERSION}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${MACOS_SIGN_IDENTITY}" \
            DEVELOPMENT_TEAM="${MACOS_TEAM_ID}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            clean build
          # Sanity check: confirm the main binary is single-arch for this matrix slice.
          lipo -info "build/Build/Products/Release/PrusaStatusBar.app/Contents/MacOS/PrusaStatusBar"

      - name: Package, sign, notarize, staple DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          SIGN_IDENTITY="${MACOS_SIGN_IDENTITY}" \
          SIGN_DMG=1 \
          NOTARIZE=1 \
          NOTARY_KEY="${AUTH_KEY_PATH}" \
          NOTARY_KEY_ID="${MACOS_NOTARY_KEY_ID}" \
          NOTARY_ISSUER="${MACOS_NOTARY_ISSUER_ID}" \
          ./scripts/make-dmg.sh \
            "build/Build/Products/Release/PrusaStatusBar.app" \
            "${DMG_NAME}"

      - name: Clean up signing keychain and notary key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

      - name: Compute sha256
        run: |
          SHA256=$(shasum -a 256 "${DMG_NAME}" | cut -d ' ' -f1)
          echo "${SHA256}" > "${DMG_NAME}.sha256"
          echo "sha256(${DMG_NAME})=${SHA256}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            ${{ env.DMG_NAME }}
            ${{ env.DMG_NAME }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build-dmg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dmg_arm64: ${{ steps.meta.outputs.dmg_arm64 }}
      dmg_x86_64: ${{ steps.meta.outputs.dmg_x86_64 }}
      sha256_arm64: ${{ steps.meta.outputs.sha256_arm64 }}
      sha256_x86_64: ${{ steps.meta.outputs.sha256_x86_64 }}
    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dmg-*
          merge-multiple: true

      - name: Collect release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_ARM64="PrusaStatusBar-${VERSION}-arm64.dmg"
          DMG_X86="PrusaStatusBar-${VERSION}-x86_64.dmg"
          SHA_ARM64=$(cat "dist/${DMG_ARM64}.sha256")
          SHA_X86=$(cat "dist/${DMG_X86}.sha256")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dmg_arm64=${DMG_ARM64}" >> "$GITHUB_OUTPUT"
          echo "dmg_x86_64=${DMG_X86}" >> "$GITHUB_OUTPUT"
          echo "sha256_arm64=${SHA_ARM64}" >> "$GITHUB_OUTPUT"
          echo "sha256_x86_64=${SHA_X86}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/${{ steps.meta.outputs.dmg_arm64 }}
            dist/${{ steps.meta.outputs.dmg_x86_64 }}
          draft: false
          prerelease: false

  bump-tap:
    name: Bump Homebrew cask
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout app repo (for cask template)
        uses: actions/checkout@v6
        with:
          path: app

      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          repository: deimosfr/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render cask
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          SHA256_ARM64: ${{ needs.publish.outputs.sha256_arm64 }}
          SHA256_X86_64: ${{ needs.publish.outputs.sha256_x86_64 }}
          DMG_ARM64: ${{ needs.publish.outputs.dmg_arm64 }}
          DMG_X86_64: ${{ needs.publish.outputs.dmg_x86_64 }}
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          URL_ARM64="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${DMG_ARM64}"
          URL_X86_64="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${DMG_X86_64}"
          sed \
            -e "s|__VERSION__|${VERSION}|g" \
            -e "s|__SHA256_ARM64__|${SHA256_ARM64}|g" \
            -e "s|__SHA256_X86_64__|${SHA256_X86_64}|g" \
            -e "s|__URL_ARM64__|${URL_ARM64}|g" \
            -e "s|__URL_X86_64__|${URL_X86_64}|g" \
            app/docs/homebrew/prusa-statusbar.rb.tmpl \
            > tap/Casks/prusa-statusbar.rb
          cat tap/Casks/prusa-statusbar.rb

      - name: Commit and push cask bump
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/prusa-statusbar.rb
          if git diff --cached --quiet; then
            echo "No cask changes."
            exit 0
          fi
          git commit -m "prusa-statusbar ${{ needs.publish.outputs.version }}"
          git push
