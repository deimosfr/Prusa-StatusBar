name: PrusaStatusBar

options:
  bundleIdPrefix: com.deimosfr
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Prototype: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.2.0"
    # Default identity is ad-hoc ("-") so any contributor can build via Xcode
    # UI without provisioning a cert. The justfile recipes override
    # CODE_SIGN_IDENTITY / DEVELOPMENT_TEAM on the xcodebuild CLI: when an
    # `apple_sign.env` is present they use the Developer ID from it (stable
    # Keychain ACL across rebuilds), otherwise they fall back to ad-hoc.
    # Release/distribution builds (just dmg-signed / dmg-release) require
    # DEVELOPER_ID exported in the environment.
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_LANGUAGE: en
    KNOWN_REGIONS: [en, de, fr, es, it, cs, pl, "pt-BR", ja, "zh-Hans"]
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Prototype:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG PROTOTYPE_MODE
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  PrusaStatusBar:
    type: application
    platform: macOS
    sources:
      - path: PrusaStatusBar
        excludes:
          - Resources/go2rtc
          - Resources/Fonts
      - path: PrusaStatusBar/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      # Embedded libvlc engine (static build, ~80 MB). Fetched on demand by
      # scripts/fetch-vlckit.sh into Vendor/ (gitignored). Embedded + signed
      # on copy; the static framework loads no external plugin dylibs.
      - framework: Vendor/VLCKit.xcframework
        embed: true
        codeSign: true
    info:
      path: PrusaStatusBar/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Prusa StatusBar
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "© 2026 Pierre Mavro"
        NSHighResolutionCapable: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ATSApplicationFontsPath: "Fonts"
        CFBundleLocalizations:
          - en
          - de
          - fr
          - es
          - it
          - cs
          - pl
          - pt-BR
          - ja
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deimosfr.prusastatusbar
        PRODUCT_NAME: PrusaStatusBar
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: PrusaStatusBar/PrusaStatusBar.entitlements
        # Build consumes a SHA-injected copy of Info.plist generated by the
        # preBuildScript below. The source PrusaStatusBar/Info.plist (managed
        # by xcodegen) stays the template; ProcessInfoPlistFile reads the
        # generated copy so the SHA survives all the way to the .app bundle.
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/Info.plist
        # Sandboxing blocks the preBuildScript from reading $(SRCROOT)/.git,
        # so `git rev-parse` returns nothing and CFBundleVersion falls back
        # to "unknown". Disable only for this target; tests inherit YES.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Generate Info.plist with git SHA
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/PrusaStatusBar/Info.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/Info.plist
        script: |
          set -eu
          mkdir -p "$DERIVED_FILE_DIR"
          cp "$SRCROOT/PrusaStatusBar/Info.plist" "$DERIVED_FILE_DIR/Info.plist"
          if command -v git >/dev/null 2>&1 && git -C "$SRCROOT" rev-parse --git-dir >/dev/null 2>&1; then
            SHA="$(git -C "$SRCROOT" rev-parse --short=7 HEAD)"
          else
            SHA="unknown"
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $SHA" "$DERIVED_FILE_DIR/Info.plist"
        showEnvVars: false
    scheme:
      testTargets:
        - PrusaStatusBarTests
      gatherCoverageData: true

  PrusaStatusBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PrusaStatusBarTests
    dependencies:
      - target: PrusaStatusBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deimosfr.prusastatusbar.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PrusaStatusBar.app/Contents/MacOS/PrusaStatusBar"
